apiVersion: v1
kind: Pod
metadata:
  name: webserver-v1
  labels:
    app: webserver
    version: v1
spec:
  containers:
    - name: nginx
      image: nginx:stable
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo '<h1>Welcome - Version 1.0</h1>' > /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'
      ports:
        - containerPort: 80
