apiVersion: v1
kind: Pod
metadata:
  name: network-nginx
  labels:
    app: network-nginx
spec:
  containers:
    - name: nginx
      image: nginx:stable
      command: ["/bin/sh", "-c"]
      args:
        - "printf '%s\n' '<h1>Antwort von Pod B (network-nginx)</h1>' > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;'"
      ports:
        - containerPort: 80
