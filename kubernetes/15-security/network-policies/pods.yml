apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: security-net-demo
  labels:
    app: web
spec:
  containers:
  - name: web
    image: nginx:stable
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed
  namespace: security-net-demo
  labels:
    access: allowed
spec:
  containers:
  - name: toolbox
    image: busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: denied
  namespace: security-net-demo
spec:
  containers:
  - name: toolbox
    image: busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: security-net-demo
spec:
  selector:
    app: web
  ports:
  - port: 80
