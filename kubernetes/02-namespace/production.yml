apiVersion: v1
kind: Pod
metadata:
  name: webserver
  namespace: production
spec:
  containers:
    - name: nginx
      image: nginx:stable
      command: ["/bin/sh", "-c"]
      args:
        - "printf '%s\\n' '<h1>production</h1><p>Version 1.0</p>' > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;'"
      ports:
        - containerPort: 80
