apiVersion: v1
kind: Pod
metadata:
  name: scheduling-demo
spec:
  nodeSelector:
    training.javacream.org/scheduling: unavailable
  containers:
  - name: web
    image: nginx:stable
    resources:
      requests:
        cpu: 100m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
