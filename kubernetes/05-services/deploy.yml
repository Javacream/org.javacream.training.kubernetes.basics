apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-test
spec:
  replicas: 2
  selector:
    matchLabels:
      chapter: services
  template:
    metadata:
      labels:
        chapter: services
    spec:
      containers:
      - name: hello-ctr
        image: javacream/hostinfo:1.0-lb
        ports:
        - containerPort: 80

