apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tkb-sts
spec:
  replicas: 3
  serviceName: dullahan
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: javacream/hostinfo:1.0-lb
        ports:
        - containerPort: 80
          name: web
