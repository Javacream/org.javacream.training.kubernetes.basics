[kubernetes]
k3s-server ansible_host=127.0.0.1 ansible_port=2201
k3s-agent-1 ansible_host=127.0.0.1 ansible_port=2202
k3s-agent-2 ansible_host=127.0.0.1 ansible_port=2203

[kubernetes:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/k3s_training
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
ansible_become=true
