apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: training-traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: training-gateway
  namespace: training-validation
spec:
  gatewayClassName: training-traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: training-route
  namespace: training-validation
spec:
  parentRefs:
    - name: training-gateway
  hostnames:
    - training.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
