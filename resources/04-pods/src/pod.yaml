apiVersion: v1
kind: Pod
metadata:
  name: web-pod
  namespace: training
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
