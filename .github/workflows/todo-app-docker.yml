name: Build and publish ToDo application

on:
  push:
    branches: [Thales-24-26-11-2026]
    paths:
      - 'introduction/container/app/**'
      - '.github/workflows/todo-app-docker.yml'
  pull_request:
    paths:
      - 'introduction/container/app/**'
      - '.github/workflows/todo-app-docker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: introduction/container/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: introduction/container/app/pom.xml
      - name: Build and test Maven application
        run: mvn --batch-mode clean package
      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-jar
          path: introduction/container/app/target/todo-app-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./introduction/container/app
          file: ./introduction/container/app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/javacream/todo-app:latest
            ghcr.io/javacream/todo-app:${{ github.sha }}
